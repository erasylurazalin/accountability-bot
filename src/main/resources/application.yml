spring:
  application:
    name: accountability-bot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accountability}
    username: ${DB_USER:accountability}
    password: ${DB_PASSWORD:}
    hikari:
      # A single-user bot with one poller thread and one tick thread. The
      # default pool of 10 would reserve far more Postgres backends than this
      # workload ever uses, and each backend costs memory on a 4 GB box.
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 10
      min-spare: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    diskspace:
      # 5400 rpm HDD with 425 GB free; the default 10 MB threshold is fine but
      # the check itself does a stat on every scrape, so keep it cheap.
      enabled: true

bot:
  token: ${TELEGRAM_BOT_TOKEN:}
  owner-chat-id: ${TELEGRAM_OWNER_CHAT_ID:0}
  poll-timeout: 50
  tick-interval-ms: 60000
  tick-initial-delay-ms: 15000
  backfill-days: 2
  claim-retry-after-seconds: 120
  claim-abandon-after-minutes: 60

  # Non-homogeneous Poisson sampler, NOTES.md section 4. The shape of the curve
  # is the design; these numbers are a preference that only a week of living
  # with it will settle, which is why they are config and not schema.
  reminder:
    # lambda = A / days_remaining, clamped. 14 reproduces the table in 4.1:
    # 30 days out ~0.5/day, 7 days ~2/day, 2 days ~7/day, 1 day hits the cap.
    deadline-lambda-base: 14.0
    # A habit's whole period is one day, so "days remaining" is the fraction of
    # today left and A is correspondingly small: ~1/day with 16 h to go,
    # ~4/day with 4 h to go, capped in the last hour.
    habit-lambda-base: 0.7
    lambda-min: 0.5
    lambda-max: 10.0
    # Guardrails from section 4.2. The per-user cap is the one that matters:
    # three commitments sampling independently will bury you, so the limit is
    # on the person, not the task.
    min-spacing-minutes: 45
    max-per-commitment-per-day: 6
    max-per-user-per-day: 12
    # How far ahead fire times are drawn and stored. Short enough that finishing
    # early does not leave hours of queued nagging behind it.
    schedule-ahead-minutes: 180

logging:
  level:
    root: INFO
    dev.era.accountability: INFO
    # Hikari logs the full JDBC URL at DEBUG; keep it quiet so credentials
    # never reach journald.
    com.zaxxer.hikari: INFO
