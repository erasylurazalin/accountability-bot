spring:
  application:
    name: accountability-bot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accountability}
    username: ${DB_USER:accountability}
    password: ${DB_PASSWORD:}
    hikari:
      # A single-user bot with one poller thread and one tick thread. The
      # default pool of 10 would reserve far more Postgres backends than this
      # workload ever uses, and each backend costs memory on a 4 GB box.
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 10
      min-spare: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    diskspace:
      # 5400 rpm HDD with 425 GB free; the default 10 MB threshold is fine but
      # the check itself does a stat on every scrape, so keep it cheap.
      enabled: true

bot:
  token: ${TELEGRAM_BOT_TOKEN:}
  owner-chat-id: ${TELEGRAM_OWNER_CHAT_ID:0}
  poll-timeout: 50
  # Unlocks /lambda and /simulate. Env var is BOT_TESTMODE:
  # Spring's relaxed binding strips the dash, so BOT_TEST_MODE does nothing.
  test-mode: ${BOT_TESTMODE:false}
  tick-interval-ms: 60000
  tick-initial-delay-ms: 15000
  claim-retry-after-seconds: 120
  claim-abandon-after-minutes: 60

  # Non-homogeneous Poisson sampler. The shape of the curve is the design;
  # these numbers are a preference that only living with it will settle, which
  # is why /lambda can override them at runtime.
  reminder:
    # lambda = base / days_remaining, clamped. 14 gives roughly 0.5 reminders
    # a day 30 days out, 2/day at a week, and hits the ceiling inside the last
    # day and a half.
    lambda-base: 14.0
    lambda-min: 0.5
    # This binds well before the deadline, so past about 1.5 days out it, not
    # lambda-base, is what controls how often you are pinged.
    lambda-max: 10.0
    # Guardrails. The per-user cap is the one that matters: several deadlines
    # sampling independently will bury you, so the limit is on the person.
    min-spacing-minutes: 45
    max-per-deadline-daily: 6
    max-per-user-daily: 12
    # How far ahead fire times are drawn and stored. Short enough that removing
    # a deadline does not leave hours of queued nagging behind it.
    schedule-ahead-minutes: 180

logging:
  level:
    root: INFO
    dev.era.accountability: INFO
    # Hikari logs the full JDBC URL at DEBUG; keep it quiet so credentials
    # never reach journald.
    com.zaxxer.hikari: INFO
