name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only. Images reach era-server through scripts/deploy.sh, not a
      # registry, so nothing is pushed from here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: accountability-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
