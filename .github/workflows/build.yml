name: build

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so a newly published CVE in an unchanged image still turns this red.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Testcontainers starts its own Postgres on the runner's Docker.
      - run: ./gradlew test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only. Images reach era-server through scripts/deploy.sh, not a
      # registry, so nothing is pushed from here. load puts the image in the
      # runner's Docker so the scan below can read it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: accountability-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails on high or critical CVEs that have a fix available. Unfixed ones
      # are left out: there is nothing to upgrade to, so failing on them would
      # only teach me to ignore a red build.
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: accountability-bot:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
